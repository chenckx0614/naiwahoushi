<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171509">
<title>奶蛙后室 · Level 0</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  #backrooms-screen {
    position:fixed; top:0; right:0; bottom:0; left:0; z-index:40;
    background:#0a0804; overflow:hidden; padding:0;
    -webkit-user-select:none; user-select:none; touch-action:none;
  }
  #backrooms-screen.hide { display:none; }
  html.br-lock, html.br-lock body { overflow:hidden !important; }
  #br-back {
    position:absolute; top:14px; left:14px; z-index:5; height:40px; padding:0 14px; border:none; border-radius:12px;
    background:rgba(255,255,255,.14); color:#ffe9a0; font-size:15px; font-weight:900; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #br-back:active { transform:scale(.92); }
  .br-stage {
    position:absolute; top:0; right:0; bottom:0; left:0; overflow:hidden;
  }
  #br-cv {
    display:block; width:100%; height:100%; image-rendering:pixelated; background:#000;
    touch-action:none;
  }
  /* VHS 扫描线叠层 */
  .br-stage::after {
    content:''; position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  .br-mask {
    position:absolute; top:0; right:0; bottom:0; left:0; z-index:2;
    background:rgba(10,8,4,.85); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:0 18px; text-align:center;
  }
  .br-mask.hide { display:none; }
  .br-mask p { color:#e8dca0; font-weight:900; font-size:16px; line-height:1.6; margin:0; }
  .br-mask .btn { min-width:150px; }
  .br-mask .br-tip { font-size:12px; color:#8a7d50; font-weight:700; }
  /* 手机摇杆 + 牛奶开火键（仅触屏显示） */
  #br-j {
    display:none; position:fixed; left:0; bottom:0; width:150px; height:150px; touch-action:none; z-index:41;
  }
  #br-jk {
    width:50px; height:50px; background:rgba(255,233,160,.65); border-radius:50%;
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 10px rgba(255,233,160,.3);
  }
  #br-j::before {
    content:''; position:absolute; left:15px; bottom:15px; width:120px; height:120px; border-radius:50%;
    background:rgba(255,233,160,.08); border:3px solid rgba(255,233,160,.25);
  }
  #br-fire {
    display:none; position:fixed; right:20px; bottom:24px; z-index:41;
    width:80px; height:80px; border:none; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #fffdf2, #f0e2b0 60%, #c9b878);
    box-shadow:0 0 18px rgba(255,233,160,.35), inset 0 -4px 8px rgba(120,100,40,.4);
    font-size:34px; line-height:1;
    -webkit-tap-highlight-color:transparent;
  }
  #br-fire:active { transform:scale(.92); box-shadow:0 0 26px rgba(255,233,160,.6); }
  @media (pointer:coarse) and (hover:none) {
    #br-j { display:block; }
    #br-fire { display:block; }
  }

  /* 蛙后室 3D：低照度档案录像，而非主游戏的糖果色界面。 */
  #backrooms-screen { background:#171509; font-family:'Consolas','Courier New',monospace; color:#f2e8bd; }
  #backrooms-screen .br-stage::after { display:none; }
  #br-cv { image-rendering:auto; }
  .br-vignette,.br-scanlines { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .br-vignette { background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.54) 100%); }
  .br-scanlines { background:repeating-linear-gradient(0deg,rgba(0,0,0,.075) 0 1px,transparent 1px 4px); opacity:.48; }
  #br-back { z-index:10; top:22px; left:24px; height:36px; border:1px solid rgba(241,225,165,.38); border-radius:2px; background:rgba(15,16,10,.7); font:600 11px 'Consolas','Courier New',monospace; letter-spacing:.08em; color:#f4e5af; }
  .br-topline { position:absolute; z-index:4; top:24px; right:28px; display:flex; align-items:center; gap:18px; color:#e6d69b; font:600 11px 'Consolas','Courier New',monospace; letter-spacing:.14em; text-shadow:0 1px 3px #000; }
  .br-rec { color:#ff715f; animation:br-rec-pulse 1.4s steps(2,end) infinite; }
  @keyframes br-rec-pulse { 50% { opacity:.35; } }
  .br-crosshair { position:absolute; z-index:3; left:50%; top:50%; width:18px; height:18px; transform:translate(-50%,-50%); pointer-events:none; opacity:.8; }
  .br-crosshair span { position:absolute; background:#f4edcf; box-shadow:0 0 3px #0b0b07; }
  .br-crosshair span:first-child { width:12px; height:1px; left:3px; top:8px; }
  .br-crosshair span:last-child { width:1px; height:12px; left:8px; top:3px; }
  .br-hud { position:absolute; z-index:4; left:24px; right:24px; bottom:24px; display:flex; align-items:end; gap:10px; pointer-events:none; }
  .br-hud-item { min-width:93px; padding:8px 11px 7px; border-top:1px solid rgba(241,225,165,.72); background:linear-gradient(180deg,rgba(16,19,12,.74),rgba(16,19,12,.9)); box-shadow:0 2px 14px rgba(0,0,0,.22); }
  .br-hud-item small { display:block; color:#b4aa86; font:600 10px 'Consolas','Courier New',monospace; letter-spacing:.12em; }
  .br-hud-item strong { display:block; margin-top:3px; color:#f5edc8; font:700 25px 'Consolas','Courier New',monospace; line-height:1; }
  .br-objective { margin-left:auto; padding:10px 13px; max-width:32vw; border-left:2px solid #e8d796; background:rgba(16,19,12,.74); color:#f0e3af; font:600 11px 'Consolas','Courier New',monospace; line-height:1.4; letter-spacing:.06em; }
  #br-toast { position:absolute; z-index:5; left:50%; top:17%; transform:translate(-50%,-8px); max-width:80vw; padding:9px 16px; border:1px solid rgba(239,222,156,.6); background:rgba(19,21,12,.87); color:#f7e9ae; font:700 12px 'Consolas','Courier New',monospace; text-align:center; opacity:0; transition:opacity .2s,transform .2s; pointer-events:none; }
  #br-toast.show { opacity:1; transform:translate(-50%,0); }
  .br-mask { z-index:7; gap:0; background:radial-gradient(ellipse at center,rgba(20,22,13,.75),rgba(8,9,6,.96)); backdrop-filter:blur(5px); }
  .br-mask-kicker { margin-bottom:13px; color:#baa96f; font:700 10px 'Consolas','Courier New',monospace; letter-spacing:.3em; }
  #br-mask-title { margin:0 0 12px; color:#f4eac4; font:900 clamp(36px,8vw,76px) 'Microsoft YaHei','PingFang SC',sans-serif; letter-spacing:.15em; text-shadow:0 0 28px rgba(224,210,128,.3); }
  .br-mask #br-msg { max-width:480px; color:#d4c99d; font:500 14px 'Microsoft YaHei','PingFang SC',sans-serif; line-height:1.8; }
  .br-enter { margin-top:28px; min-width:220px; height:52px; padding:0 20px; border:1px solid #e9d796; border-radius:2px; background:linear-gradient(90deg,#d4bd76,#f0dfa0); color:#242316; font:800 13px 'Consolas','Courier New',monospace; letter-spacing:.12em; cursor:pointer; box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .br-enter span { margin-left:16px; font-size:19px; vertical-align:-1px; }
  .br-enter:hover { background:#ffecad; }
  .br-mask .br-tip { max-width:440px; margin-top:18px; color:#9e977c; font:500 11px 'Consolas','Courier New',monospace; line-height:1.6; }
  .br-progress { display:flex; align-items:center; gap:12px; width:min(340px,72vw); margin-top:6px; }
  .br-progress.hide { display:none; }
  .br-progress-track { position:relative; flex:1; height:8px; border-radius:99px; background:rgba(255,240,180,.12); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(224,210,128,.22); }
  .br-progress-fill { width:0%; height:100%; border-radius:99px; background:linear-gradient(90deg,#8f7d3a,#e8d26a); transition:width .18s ease-out; }
  .br-progress-pct { min-width:44px; text-align:right; color:#e8d26a; font:700 12px 'Consolas','Courier New',monospace; letter-spacing:.05em; }
  #br-j { z-index:9; left:12px; bottom:10px; }
  #br-j::before { border-color:rgba(230,216,161,.42); background:rgba(19,21,12,.3); }
  #br-jk { background:rgba(230,216,161,.74); }
  #br-fire,#br-run { z-index:9; display:none; position:fixed; border:1px solid rgba(239,226,170,.65); color:#f3e5b4; background:rgba(19,21,12,.7); box-shadow:0 0 16px rgba(0,0,0,.3); touch-action:none; }
  #br-fire { right:23px; bottom:23px; width:72px; height:72px; font-size:30px; }
  #br-run { right:103px; bottom:33px; width:52px; height:52px; border-radius:50%; font-size:30px; cursor:pointer; }
  #backrooms-screen:not(.playing) #br-j,#backrooms-screen:not(.playing) #br-fire,#backrooms-screen:not(.playing) #br-run { display:none; }
  @media (pointer:coarse) { #backrooms-screen.playing #br-j,#backrooms-screen.playing #br-fire,#backrooms-screen.playing #br-run { display:block; } }
  @media (max-width:650px) {
    #br-back { top:14px; left:13px; }
    .br-topline { top:19px; right:14px; gap:8px; font-size:9px; }
    .br-topline span:nth-child(2) { display:none; }
    .br-hud { left:12px; right:12px; bottom:175px; gap:6px; align-items:stretch; }
    .br-hud-item { min-width:0; flex:1; padding:6px 8px; }
    .br-hud-item small { font-size:8px; }
    .br-hud-item strong { font-size:18px; }
    .br-objective { max-width:110px; padding:6px 8px; font-size:9px; }
    #br-toast { top:14%; }
  }

  /* ---- 独立版外壳：入口大厅 ---- */
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; background:#171509; }
  body { font-family:'Consolas','Courier New',monospace; color:#f2e8bd; overflow:hidden; }

  #lobby {
    position:fixed; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(120,104,50,.20), transparent 62%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 4px),
      #171509;
  }
  #lobby.hide { display:none; }
  #lobby .kicker { color:#baa96f; font:700 10px 'Consolas','Courier New',monospace; letter-spacing:.34em; }
  #lobby h1 {
    margin:0; color:#f4eac4; font:900 clamp(40px,10vw,88px) 'Microsoft YaHei','PingFang SC',sans-serif;
    letter-spacing:.16em; text-shadow:0 0 34px rgba(224,210,128,.28);
  }
  #lobby p { max-width:460px; margin:0; color:#a89e79; font:500 13px/1.9 'Microsoft YaHei','PingFang SC',sans-serif; }
  #lobby-btn {
    margin-top:10px; min-width:230px; height:54px; padding:0 22px;
    border:1px solid #e9d796; border-radius:2px;
    background:linear-gradient(90deg,#d4bd76,#f0dfa0); color:#242316;
    font:800 13px 'Consolas','Courier New',monospace; letter-spacing:.14em; cursor:pointer;
    box-shadow:0 10px 34px rgba(0,0,0,.34);
    -webkit-tap-highlight-color:transparent;
  }
  #lobby-btn:hover { background:#ffecad; }
  #lobby-btn:active { transform:translateY(1px); }
  #lobby .foot { margin-top:6px; color:#6e6950; font:600 10px 'Consolas','Courier New',monospace; letter-spacing:.16em; }

  /* 加载态：3D 包（12.6MB）下载进度 */
  #boot { position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:#171509; }
  #boot.hide { display:none; }
  #boot .kicker { color:#baa96f; font:700 10px 'Consolas','Courier New',monospace; letter-spacing:.3em; }
  #boot-track { position:relative; width:min(320px,72vw); height:8px; border-radius:99px;
    background:rgba(255,240,180,.12); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(224,210,128,.22); }
  #boot-fill { width:0%; height:100%; border-radius:99px;
    background:linear-gradient(90deg,#8f7d3a,#e8d26a); transition:width .18s ease-out; }
  #boot-pct { color:#e8d26a; font:700 12px 'Consolas','Courier New',monospace; letter-spacing:.05em; }
  #boot-err { display:none; max-width:420px; color:#e0a05a; font:600 12px/1.7 'Microsoft YaHei',sans-serif; text-align:center; }
  #boot-err.show { display:block; }
</style>
</head>
<body>

<!-- 启动加载层 -->
<div id="boot">
  <div class="kicker">NAIWA // ARCHIVE 001</div>
  <div id="boot-track"><div id="boot-fill"></div></div>
  <div id="boot-pct">0%</div>
  <div id="boot-err"></div>
</div>

<!-- 入口大厅 -->
<div id="lobby" class="hide">
  <div class="kicker">NAIWA // ARCHIVE 001</div>
  <h1>蛙后室</h1>
  <p>救出 3 只迷路的奶鼠，再找到绿色出口。奶蛋看见你后会追一小段，趁它停下时绕开。</p>
  <button id="lobby-btn">进入 LEVEL 0 →</button>
  <div class="foot">WASD 移动 · 鼠标观察 · 点击/空格泼牛奶 · Shift 奔跑</div>
</div>

<!-- 蛙后室：整页 3D -->
<div id="backrooms-screen" class="hide">
  <button id="br-back" onclick="backToLobby()">← <span id="br-back-label">返回大厅</span></button>
  <div class="br-stage">
    <canvas id="br-cv" aria-label="奶蛙后室 3D 场景"></canvas>
    <div class="br-vignette"></div>
    <div class="br-scanlines"></div>
    <div class="br-crosshair" aria-hidden="true"><span></span><span></span></div>
    <div class="br-topline"><span class="br-rec">● REC</span><span>NAIWA // LEVEL 0</span><span id="br-clock">00:00</span></div>
    <div class="br-hud">
      <div class="br-hud-item"><small id="br-hp-label">生命</small><strong id="br-hp">100</strong></div>
      <div class="br-hud-item"><small id="br-milk-label">牛奶</small><strong id="br-milk">12</strong></div>
      <div class="br-hud-item"><small id="br-rescued-label">已救援</small><strong id="br-rescued">0 / 3</strong></div>
      <div class="br-objective" id="br-objective">寻找迷路的奶鼠</div>
    </div>
    <div id="br-toast" role="status"></div>
    <div class="br-mask" id="br-mask">
      <div class="br-mask-kicker">NAIWA / ARCHIVE 001</div>
      <h2 id="br-mask-title">蛙后室</h2>
      <p id="br-msg">救出 3 只迷路奶鼠，再找到出口。奶蛋会短暂追逐，趁它停下时绕开。</p>
      <button class="br-enter" id="br-start-btn">进入 LEVEL 0 <span>→</span></button>
      <p class="br-tip" id="br-tip">WASD 移动 · 鼠标转向 · 点击或空格泼牛奶 · Shift 奔跑</p>
    </div>
  </div>
  <div id="br-j"><div id="br-jk"></div></div>
  <button id="br-run" title="奔跑">↟</button>
  <button id="br-fire" title="泼牛奶">🥛</button>
</div>

<script>
/* 独立版外壳：只负责 3D 包的加载进度、大厅/游戏切换。
   游戏本体全部在 backrooms3d.bundle.js 内（window.Backrooms3D）。 */
var $ = function(id){ return document.getElementById(id); };

function backToLobby(){
  if(window.Backrooms3D) window.Backrooms3D.stop();
  $('backrooms-screen').classList.add('hide');
  document.documentElement.classList.remove('br-lock');
  $('lobby').classList.remove('hide');
}

$('lobby-btn').addEventListener('click', function(){
  $('lobby').classList.add('hide');
  $('backrooms-screen').classList.remove('hide');
  document.documentElement.classList.add('br-lock');
  if(!window.Backrooms3D){
    /* 极端情况：包还没就绪（正常流程进不来） */
    backToLobby();
    return;
  }
  window.Backrooms3D.open({ music:true, sfx:true });
});

/* 启动：fetch 流式下载 3D 包，进度条走真实字节数 */
(function(){
  var fill = $('boot-fill'), pct = $('boot-pct'), err = $('boot-err');
  var SRC = 'backrooms3d.bundle.js';
  function done(){
    $('boot').classList.add('hide');
    $('lobby').classList.remove('hide');
  }
  function fail(msg){
    err.textContent = msg;
    err.classList.add('show');
  }
  function inject(text){
    var s = document.createElement('script');
    s.textContent = text;
    document.body.appendChild(s);
  }
  if(!window.fetch){ loadScriptTag(); return; }
  fetch(SRC).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    var total = +(res.headers.get('Content-Length') || 0);
    if(!res.body || !total){ return res.text().then(inject); }
    var reader = res.body.getReader(), got = 0, chunks = [];
    return (function pump(){
      return reader.read().then(function(r){
        if(r.done){
          var blob = new Blob(chunks, { type:'text/javascript' });
          return blob.text().then(inject);
        }
        chunks.push(r.value); got += r.value.length;
        var p = Math.min(99, Math.round(got / total * 100));
        fill.style.width = p + '%'; pct.textContent = p + '%';
        return pump();
      });
    })();
  }).then(function(){
    fill.style.width = '100%'; pct.textContent = '100%';
    setTimeout(done, 180);
  }).catch(function(e){
    console.error('[boot] bundle load failed', e);
    loadScriptTag();
  });

  function loadScriptTag(){
    var s = document.createElement('script');
    s.src = SRC;
    s.onload = done;
    s.onerror = function(){ fail('3D 包加载失败：请确认 backrooms3d.bundle.js 与本页面同目录，然后刷新重试。'); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
